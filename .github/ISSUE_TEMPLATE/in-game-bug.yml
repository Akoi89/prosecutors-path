name: In-game problem
description: The ROM built, but something is wrong when you play it
labels: [in-game]
body:
  - type: markdown
    attributes:
      value: |
        Freezes, missing or clipped text, wrong speaker, a scene that repeats itself.
        These are the bugs that matter most and the ones least likely to be found any
        other way - every freeze a player hit so far was found by playing, not by the tools.

        Some lines are still the fan translation on purpose, about one character in
        eighty. The README's "Already known" list says which parts. Send it anyway if
        you are not sure; a fan-translated line that looks wrong is still worth reporting.

  - type: input
    id: where
    attributes:
      label: Where in the game
      placeholder: Episode 2, first investigation, after examining the desk
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happens
      description: A screenshot or a short clip is worth more than any description here.
    validations:
      required: true

  - type: input
    id: emulator
    attributes:
      label: Emulator or hardware
      placeholder: melonDS 1.0, DeSmuME, flashcart on a DS Lite
    validations:
      required: true

  - type: textarea
    id: audit
    attributes:
      label: The build's audit output
      description: >
        The block of counters the build printed at the end ("entries replaced with
        official English: ..."). It identifies exactly which build you are playing.
      render: text
    validations:
      required: false
